# Keep this workflow and .github/workflows/README.md in sync — update both in the same PR
# whenever a step, job name, Node version, or service container changes here.
name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

# Cancel a superseded run when new commits land on the same PR/branch, instead of letting
# both runs burn CI minutes to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · TypeCheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      # Backs the Redis integration smoke tests (e.g. gig.service.redis-integration.spec.ts).
      # Tests that need it check `process.env.REDIS_URL` themselves and skip when it's unset,
      # so this is additive — it doesn't change behavior of the mocked-Redis unit tests.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # SENTRY_DSN intentionally absent — every step must pass without it
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npm run lint:check

      - name: Format check
        working-directory: ./backend
        run: npm run format:check

      - name: TypeScript check — blocks PR on type errors
        working-directory: ./backend
        run: npx tsc --noEmit

      # Catches a token/service import cycle (e.g. #429) before it ships: Nest silently
      # resolves the cycled DI token to `undefined` at runtime instead of failing to compile.
      - name: Circular dependency check
        working-directory: ./backend
        run: npm run check:cycles

      # Belt-and-suspenders alongside the service's own --health-cmd/--health-retries above
      # (which gates job startup, not necessarily readiness by the time this step runs):
      # explicitly retry a real connection before trusting REDIS_URL in the test step.
      - name: Wait for Redis
        run: |
          for i in $(seq 1 15); do
            if (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1; then
              echo "Redis is accepting connections"
              exit 0
            fi
            echo "Waiting for Redis... ($i/15)"
            sleep 2
          done
          echo "::error::Redis did not become available in time" >&2
          exit 1

      - name: Unit tests
        working-directory: ./backend
        run: npm run test:ci
        env:
          REDIS_URL: redis://localhost:6379

      - name: Build
        working-directory: ./backend
        run: npm run build

      # Dependency vulnerability scanning with npm audit.
      # Fails the build if high or critical vulnerabilities are found in the dependency tree.
      # The --audit-level=high threshold balances security with practicality — low/moderate
      # findings are logged but don't block CI, giving teams time to evaluate and update
      # dependencies on a reasonable schedule rather than forcing immediate action on every
      # minor advisory.
      - name: Dependency vulnerability scan
        working-directory: ./backend
        run: npm audit --audit-level=high

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: ./backend/coverage
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
