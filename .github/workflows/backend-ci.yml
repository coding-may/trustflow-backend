# Keep this workflow and .github/workflows/README.md in sync — update both in the same PR
# whenever a step, job name, Node version, or service container changes here.
name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

# Cancel a superseded run when new commits land on the same PR/branch, instead of letting
# both runs burn CI minutes to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · TypeCheck · Test · Build
    runs-on: ubuntu-latest
    # Bumped from 5 to 7 when the postgres service container and its integration specs were
    # added — pulling the extra image and the "Wait for Postgres" step add well under a
    # minute in practice, but this leaves headroom instead of running right at the edge.
    timeout-minutes: 7

    services:
      # Backs the Redis integration smoke tests (e.g. gig.service.redis-integration.spec.ts).
      # Tests that need it check `process.env.REDIS_URL` themselves and skip when it's unset,
      # so this is additive — it doesn't change behavior of the mocked-Redis unit tests.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Backs the Postgres integration specs (e.g. database.postgres-integration.spec.ts,
      # health.postgres-integration.spec.ts). Tests that need it check `process.env.DATABASE_URL`
      # themselves and skip when it's unset, so this is additive — it doesn't change behavior
      # of the mocked-pool unit tests.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustflow
          POSTGRES_PASSWORD: trustflow
          POSTGRES_DB: trustflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # SENTRY_DSN intentionally absent — every step must pass without it
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npm run lint:check

      - name: Format check
        working-directory: ./backend
        run: npm run format:check

      - name: TypeScript check — blocks PR on type errors
        working-directory: ./backend
        run: npx tsc --noEmit

      # Catches a token/service import cycle (e.g. #429) before it ships: Nest silently
      # resolves the cycled DI token to `undefined` at runtime instead of failing to compile.
      - name: Circular dependency check
        working-directory: ./backend
        run: npm run check:cycles

      - name: Environment variable audit
        working-directory: ./backend
        run: npx tsx scripts/audit-env-vars.ts
      # Verify zero-downtime migrations have proper rollback paths and don't use
      # destructive operations or table-locking DDL that would break during deployment.
      - name: Migration verification check
        working-directory: ./backend
        run: npx ts-node scripts/verify-migrations.ts
        env:
          DATABASE_URL: postgres://trustflow:trustflow@localhost:5432/trustflow_test

      # Belt-and-suspenders alongside the service's own --health-cmd/--health-retries above
      # (which gates job startup, not necessarily readiness by the time this step runs):
      # explicitly retry a real connection before trusting REDIS_URL in the test step.
      - name: Wait for Redis
        run: |
          for i in $(seq 1 15); do
            if (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1; then
              echo "Redis is accepting connections"
              exit 0
            fi
            echo "Waiting for Redis... ($i/15)"
            sleep 2
          done
          echo "::error::Redis did not become available in time" >&2
          exit 1

      # Belt-and-suspenders alongside postgres's own --health-cmd/--health-retries above:
      # explicitly retry a real connection before trusting DATABASE_URL in the test step.
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 15); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo "Postgres is accepting connections"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/15)"
            sleep 2
          done
          echo "::error::Postgres did not become available in time" >&2
          exit 1

      - name: Unit tests
        working-directory: ./backend
        run: npm run test:ci
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgres://trustflow:trustflow@localhost:5432/trustflow_test

      - name: Build
        working-directory: ./backend
        run: npm run build

      # Dependency vulnerability scan — gates on the PRODUCTION dependency tree only
      # (--omit=dev). See backend/DEPENDENCY_AUDIT_POLICY.md for the triage process and the
      # checked-in allow-list of advisories accepted for now (each with a reason and an
      # expiry date). The --audit-level=high threshold balances security with practicality —
      # low/moderate findings are logged but don't block CI, giving teams time to evaluate
      # and update dependencies on a reasonable schedule rather than forcing immediate
      # action on every minor advisory. Dev-only findings (lint/build tooling — never
      # shipped) are reported separately below without blocking the build, so a new advisory
      # in, say, eslint's dependency tree can't mask the lint/type/test results above by
      # failing the job outright.
      - name: Dependency vulnerability scan (production)
        working-directory: ./backend
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency vulnerability scan (dev, non-blocking)
        working-directory: ./backend
        run: npm audit --audit-level=high || echo "::warning::Dev-dependency high/critical advisories found — see backend/DEPENDENCY_AUDIT_POLICY.md. Not blocking the build."

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: ./backend/coverage
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Multi-arch Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: trustflow-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/trustflow-backend.tar

      - name: Load Docker image for scanning
        run: docker load --input /tmp/trustflow-backend.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: trustflow-backend:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
